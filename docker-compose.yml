# Local development infrastructure. Only what the current slice needs.
services:
  postgres:
    image: postgres:18-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marketplace
    volumes:
      # postgres:18+ images store data under /var/lib/postgresql (not .../data)
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
