packages:
  - 'apps/*'
  - 'packages/*'

engineStrict: true

allowBuilds:
  # ssh2's optional native accelerators do not compile on Node 26 yet.
  # Its supported JavaScript implementation is used by Testcontainers instead.
  cpu-features: false
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  ssh2: false

minimumReleaseAgeExclude:
  - '@hookform/resolvers@6.0.1'
  - lucide-react@1.62.0
